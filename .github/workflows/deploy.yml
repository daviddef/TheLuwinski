name: Build and deploy the archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default depth of one. The sitemap's <lastmod> is each
      # page's own last commit; on a shallow clone every page would report the same
      # date, which is the signal that teaches a crawler to ignore the field.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci || npm install
        working-directory: site
      # The register is committed already built. The raw harvest it comes from
      # holds every living person in full and is deliberately not in this
      # repository, so CI cannot and should not regenerate it.
      - name: Build
        run: npx astro build
        working-directory: site
      # THE NAME LINKER (kit/tools/autolink.py, 18 October 2026). Rewrites the BUILT pages so that the first mention, in
      # each section, of a name that is one dead person with a page becomes a link to that page, and a name several
      # dead people bear becomes a link to /search/?q=. It runs HERE, before the search index and before every check that
      # reads the built HTML, so those see the linked pages exactly as they will be served.
      #
      # WHAT CI CAN AND CANNOT SEE. The index (site/src/data/names-index.json) is COMMITTED: it holds only dead people who
      # have a public page, and it was generated on the machine that holds the private harvest, so the deploy links exactly
      # the names that were checked there. CI cannot regenerate it and does not try; it checks that every committed entry
      # is one the committed register still gives (tools/build-names-index.py --check, the public half of the same test).
      # CI cannot read the private feed (living and held-out spellings), so its living list is built from the committed
      # register alone (tools/build-living-list.py --public): all five people the register flags as living or named-only,
      # their names and page addresses. A held-out person is in no register and in no page, so is not in the index, and
      # autolink refuses (exit 2) to run if the index and the living list ever meet. The full list runs in `npm run build`
      # on the machine that holds the harvest, which is where the index is made. All paths are site-relative, as in the
      # check:book step below.
      - name: Check that the names index still matches the register
        run: python3 ../tools/build-names-index.py --check
        working-directory: site
      # The records table (site/src/data/records.json) is committed, written by tools/build-records.py from the ledger
      # (evidence.json) and data/record-plates.json. CI cannot see the private feed that holds back a ledger entry naming a
      # living person, so it checks the public half: every committed row is one the public data gives, and no entry on the
      # hold list is in the table.
      - name: Check that the records table still matches the ledger
        run: python3 ../tools/build-records.py --check
        working-directory: site
      - name: Link the names on the built pages
        run: |
          python3 ../tools/build-living-list.py --public --out "$RUNNER_TEMP/living.json"
          python3 node_modules/@daviddef/archive-kit/kit/tools/autolink.py --dist dist --index src/data/names-index.json --living "$RUNNER_TEMP/living.json" --allow-prefix /people/ --allow-prefix /search/
        working-directory: site
      # Indexes the RENDERED pages, so what is searchable is exactly what a
      # reader can see - and nothing the living-persons rule removed. A page that
      # noindexes itself (a living person's page) is left out of the index.
      - name: Build the search index
        run: python3 tools/build-search.py
      # Fails if the search page fetches a file that was not published, if the index is
      # stale (an indexable page, now including every person's, absent from it), or if a
      # noindex page is IN it. Added to CI 16 October 2026 with the person pages; until
      # then only `npm run build` ran it, which is the gap the comment below describes.
      - name: Check the search index
        run: python3 tools/check-search.py
      # CI runs `astro build` and a chosen few steps, NOT `npm run build`, because that
      # chain starts by regenerating the register from a private harvest this
      # repository does not hold. So anything the local chain does after astro build
      # has to be added here by name or it exists only on the machine that built it.
      # The sitemap was missed for exactly that reason: robots.txt, a static file in
      # public/, shipped and pointed at a sitemap.xml that CI never wrote. 13 Oct 2026.
      # Built from the rendered HTML, so it withholds noindex pages and redirect stubs.
      - name: Write the sitemap
        run: python3 node_modules/@daviddef/archive-kit/kit/tools/sitemap.py
        working-directory: site
      # THE BOOK (17 October 2026): the whole site is one book, and a page nobody placed fails the build. This
      # reads the BUILT pages against site/src/data/book.json: every page is a chapter, inherits one (a person's
      # page belongs to The people), or is outside on purpose; every page carries its running head; every
      # Previous and Next matches the book's order; nothing is empty. The tool resolves --dist and --book against
      # its working directory, so this step runs from site/ like the sitemap above, with site-relative paths. An
      # earlier step that passed `site/dist` from the repository root looked for site/site/dist and failed.
      - name: Check that every page is placed in the book
        run: python3 node_modules/@daviddef/archive-kit/kit/tools/checkbook.py --dist dist --book src/data/book.json
        working-directory: site
      # The archive's standard for living people (version 2, 16 October 2026): a living person
      # (80 or younger, with no death recorded) is named with their relationships and their town
      # and country, and nothing more, on a page that is noindex; an undated person with a
      # living parent is published nowhere; every person the archive names has a page of their own. This checks the RENDERED
      # pages, the served JSON, the sitemap, the search index and the generated register rather
      # than trusting the generator, and the deploy is gated on it. It refuses to pass if it can
      # recognise no living person or finds no person page.
      # Runs in --hashes mode here: the names cannot be recognised from the harvest, which this
      # repository does not hold, so CI recognises them by salted digest, finds the living and the
      # held out by the ids in data/guarded-hashes.json, and re-applies the kit's living_rule to the
      # register's own fields. The exact --harvest check, and the exact leak scan for the harvest's
      # dates, run locally, where the private source is.
      - name: Check that every living person is shown as a name, a relationship and a place only
        run: python3 tools/check-living.py --dist site/dist --mode hashes
      # The gate is tested the way it is meant to be trusted: a fault is planted for every rule in
      # a copy of the build, and the step fails unless each one is caught and each control passes.
      - name: Check that the living-people gate still catches what it should
        run: python3 tools/selftest-living.py --dist site/dist
      # The prose gate (kit checkprose.py, wired by tools/check-prose.py): a hand-written page, a hand-edited
      # data file or a letter may not put a year, a date, a life-event word or a DNA result beside a living
      # person's name. Who is living comes from the private harvest, which CI does not hold, so here the gate
      # checks only that every data file is classified as hand-edited or generated and then prints
      # "NOT RUN, this is NOT A PASS" for the name scan. The name scan runs in `npm run build` on the machine
      # that holds the harvest (check:prose-strict makes a missing harvest a failure there).
      - name: Check the prose for living people (name scan NOT RUN in CI)
        run: python3 tools/check-prose.py
      # The family pages (/families/, added 17 October 2026): every quotation is verbatim in its source, every
      # declaration matches the tree, every count is recomputed, no living person is named or linked, every
      # page is in the nav, the index, the sitemap and the search index. Needs only the repository and the build.
      # The self-test plants a fault for each rule and fails unless each is caught.
      - name: Check the family pages
        run: python3 tools/check-families.py --dist dist
      - name: Check that the family-page gate still catches what it should
        run: python3 tools/check-families.py --dist dist --selftest
      # The ratchet behind the name linker: a page may only get better. A name that resolves and is left unlinked, a link whose
      # person has since been merged or hidden, or any link to a living address fails the deploy. Counts only; it prints no name.
      - name: Check that every name that resolves is linked, and that no page got worse
        run: python3 node_modules/@daviddef/archive-kit/kit/tools/checklinks.py --dist dist --index src/data/names-index.json --living "$RUNNER_TEMP/living.json" --allow-prefix /people/ --allow-prefix /search/ --floor .linkfloor.json
        working-directory: site
      - name: Check that the name linker still catches what it should
        run: python3 node_modules/@daviddef/archive-kit/kit/tools/autolink_selftest.py
        working-directory: site
      # THE FAMILY STORY (/story/, 25 October 2026): the kit's gate on src/data/story.json and on the BUILT page. Every paragraph
      # graded doc / inf / lore or sourced archive / history, every chapter's papers resolving, every person link a built page, every
      # map dot inside its extent, and no living person beside a date. CI's living list is the public one built above from the
      # committed register (the same file the linker uses); locally `npm run check:story` passes the private list. Then the gate's
      # own selftest, which plants each fault in the kit's example story and fails unless each is caught.
      - name: Check the family story
        run: |
          python3 node_modules/@daviddef/archive-kit/kit/tools/checkfamilystory.py --story src/data/story.json --dist dist --person-base /people/ --living "$RUNNER_TEMP/living.json"
          python3 node_modules/@daviddef/archive-kit/kit/tools/checkfamilystory.py --selftest
        working-directory: site
      # THE DIRECT LINE AND THE FAMILY RIBBONS (27 October 2026, kit/docs/family-ribbon.md). src/data/direct-line.json is the
      # story's ribbon (who is tinted as our direct line), made by the kit's directline.py; family-lines.json and
      # family-blocks.json are made by tools/build-family-lines.py from the story, the register and the English line. Both are
      # committed and checked here to be what their sources make. Then the kit's gate reads the BUILT pages back: a ribbon and a
      # block for every family and connection, a card tinted exactly when its person is on the line, the story ribbon tinted on
      # the line and nowhere else, the band on every direct-line person's page and on no other, the legend wherever the tint is;
      # then its selftest, which plants each fault in the kit's example families.
      - name: Check the direct line, the family ribbons and how our line connects
        run: |
          python3 node_modules/@daviddef/archive-kit/kit/tools/directline.py --story src/data/story.json --check src/data/direct-line.json
          python3 ../tools/build-family-lines.py --check
          python3 node_modules/@daviddef/archive-kit/kit/tools/checkfamilyribbon.py --families src/data/family-lines.json --direct src/data/direct-line.json --story src/data/story.json --dist dist --lines src/data/lines.json --living "$RUNNER_TEMP/living.json"
          python3 node_modules/@daviddef/archive-kit/kit/tools/checkfamilyribbon.py --selftest
        working-directory: site
      # THE RIBBON FLAGS (27 October 2026, kit/docs/ribbon-flags.md): a strip of mini flags in each ribbon card's header row, the
      # state that held the place in the card's year and the country it is in today where that is another flag. The flags are
      # committed in site/src/data/ribbon-flags.json, made by tools/build-ribbon-flags.py with the kit's ribbonflags.py from the era
      # snapshot, flag-places.json and flag-countries.json (hand-written, each entry with its evidence), and put on the cards as the
      # pages draw them (a file of its own because the story's and the family ribbon's contracts do not know a card field `flags`).
      # Here: the file is what the inputs make; then the kit's gate, over copies of the two ribbon files with the flags put back,
      # recomputes every flag independently and reads the BUILT pages (no flag where the rules are silent, no flag of a hate-symbol
      # or occupation regime, no year on a living card, the credit on the page); then its selftest.
      - name: Check the ribbon flags
        run: |
          python3 ../tools/build-ribbon-flags.py --check --merged "$RUNNER_TEMP/ribbonflags"
          python3 node_modules/@daviddef/archive-kit/kit/tools/checkribbonflags.py --snapshot src/data/era-snapshot.json --story "$RUNNER_TEMP/ribbonflags/story.json" --family-lines "$RUNNER_TEMP/ribbonflags/family-lines.json" --alias src/data/flag-places.json --countries src/data/flag-countries.json --dist dist
          python3 node_modules/@daviddef/archive-kit/kit/tools/checkribbonflags.py --selftest
        working-directory: site
      # The box gate, which needs a browser: Chrome is on the runner, and playwright-core is installed without saving it (no
      # dependency of the site) in the checkout's root node_modules, outside site/, where the kit's script finds it. It serves dist
      # and measures every ribbon card on /story/ and on every family page with a ribbon, with and without its flags, at 1440, 1100
      # and 390: one pixel of difference, or a strip on a word, fails; not run (exit 2) fails too.
      # THE LINKING STANDARD (18 October 2026): the twelve narrative pages are held to five rules, and the number of
      # violations of each may only go down (site/.standardfloor.json, counts only, no name, no address of a person).
      # L1 names that resolve are linked, L2 a person read from a record has an entry, L3 a passage that cites a record
      # links to it, L4 a held scan sits in the section that cites it, L5 forms the machine cannot resolve are counted.
      # WHAT CI CAN AND CANNOT SEE, as for the linker above: it reads the BUILT pages, the committed names index, the
      # committed records table (site/src/data/records.json) and standard.json, and the living list built from the
      # committed register (--public), so it counts exactly what the machine with the private harvest counts. The one
      # input it must build itself is the given-name vocabulary (site/given.json, gitignored): tools/build-given-names.py
      # derives it from the committed register and English-line files, living and named-only people leaving nothing in it.
      # Every path is site-relative, as in the steps above.
      - name: Build the given-name vocabulary for the linking standard
        run: python3 ../tools/build-given-names.py
        working-directory: site
      - name: Check the linking standard, and that no page got worse
        run: python3 node_modules/@daviddef/archive-kit/kit/tools/checkstandard.py --dist dist --index src/data/names-index.json --config standard.json --living "$RUNNER_TEMP/living.json" --floor .standardfloor.json --strict-config
        working-directory: site
      - name: Check that the linking-standard gate still catches what it should
        run: python3 node_modules/@daviddef/archive-kit/kit/tools/checkstandard_selftest.py
        working-directory: site
      # THE «AT THE TIME» NOTES (18 October 2026): beside a dated place-event on a person who is not living, a small muted line saying who
      # held that ground in that year, from the Record Atlas's region eras, as this archive committed them (site/src/data/era-snapshot.json,
      # refreshed only deliberately by tools/build-era.py --snapshot; nothing in a build reads the Atlas). Context about the ground, never a
      # claim about the family, and silence wherever the data does not support one. The place -> region table is data/era/ground.tsv: the first
      # step fails if a place a person's page prints has no row, if a row is stale, if the committed places file is not what the rows build,
      # or if a mapped place has a dated event in an Atlas era that describes only part of its region. The second reads the BUILT pages:
      # every note is an era the snapshot holds, in the right year, with the snapshot's own words and the Atlas's own link; none on a
      # noindex page, a data-living page or a page of the register's living list (built here from the committed register: every path is a
      # living or named-only person's page, no name). It prints counts only. The third plants a fault for each rule in the kit's own
      # self-test and fails unless each is caught. Every path is site-relative, as in the steps above.
      - name: Check that the era-place table still matches the data
        run: python3 ../tools/build-era.py --check
        working-directory: site
      - name: Check the at-the-time notes on the built pages
        run: |
          python3 ../tools/build-era.py --living-urls "$RUNNER_TEMP/era-living.json"
          python3 node_modules/@daviddef/archive-kit/kit/tools/checkera.py --dist dist --snapshot src/data/era-snapshot.json --living-urls "$RUNNER_TEMP/era-living.json" --require-tracked
        working-directory: site
      - name: Check that the at-the-time gate still catches what it should
        run: python3 node_modules/@daviddef/archive-kit/kit/tools/era_selftest.py
        working-directory: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
