name: Build and deploy the archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default depth of one. The sitemap's <lastmod> is each
      # page's own last commit; on a shallow clone every page would report the same
      # date, which is the signal that teaches a crawler to ignore the field.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci || npm install
        working-directory: site
      # The register is committed already built. The raw harvest it comes from
      # holds every living person in full and is deliberately not in this
      # repository, so CI cannot and should not regenerate it.
      - name: Build
        run: npx astro build
        working-directory: site
      # Indexes the RENDERED pages, so what is searchable is exactly what a
      # reader can see - and nothing the living-persons rule removed.
      - name: Build the search index
        run: python3 tools/build-search.py
      # CI runs `astro build` and a chosen few steps, NOT `npm run build`, because that
      # chain starts by regenerating the register from a private harvest this
      # repository does not hold. So anything the local chain does after astro build
      # has to be added here by name or it exists only on the machine that built it.
      # The sitemap was missed for exactly that reason: robots.txt, a static file in
      # public/, shipped and pointed at a sitemap.xml that CI never wrote. 13 Oct 2026.
      # Built from the rendered HTML, so it withholds noindex pages and redirect stubs.
      - name: Write the sitemap
        run: python3 node_modules/@daviddef/archive-kit/kit/tools/sitemap.py
        working-directory: site
      # The archive promises that living people are not present in the output.
      # This checks the rendered HTML rather than trusting the generator, and the
      # deploy is gated on it. It has already caught one real case: a dateless
      # duplicate record of a man who died in 1932, flagged as living.
      # Runs in --hashes mode here: the names to keep out of a public repository
      # cannot themselves be in it, so CI guards on salted digests and hashes
      # candidate names out of the rendered HTML. The exact --harvest check runs
      # locally, where the private source is.
      - name: Check that no living person is in the build
        run: python3 tools/check-living.py --dist site/dist --mode hashes
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
