name: Build and deploy the archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default depth of one. The sitemap's <lastmod> is each
      # page's own last commit; on a shallow clone every page would report the same
      # date, which is the signal that teaches a crawler to ignore the field.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci || npm install
        working-directory: site
      # The register is committed already built. The raw harvest it comes from
      # holds every living person in full and is deliberately not in this
      # repository, so CI cannot and should not regenerate it.
      - name: Build
        run: npx astro build
        working-directory: site
      # Indexes the RENDERED pages, so what is searchable is exactly what a
      # reader can see - and nothing the living-persons rule removed. A page that
      # noindexes itself (a living person's page) is left out of the index.
      - name: Build the search index
        run: python3 tools/build-search.py
      # Fails if the search page fetches a file that was not published, if the index is
      # stale (an indexable page, now including every person's, absent from it), or if a
      # noindex page is IN it. Added to CI 16 October 2026 with the person pages; until
      # then only `npm run build` ran it, which is the gap the comment below describes.
      - name: Check the search index
        run: python3 tools/check-search.py
      # CI runs `astro build` and a chosen few steps, NOT `npm run build`, because that
      # chain starts by regenerating the register from a private harvest this
      # repository does not hold. So anything the local chain does after astro build
      # has to be added here by name or it exists only on the machine that built it.
      # The sitemap was missed for exactly that reason: robots.txt, a static file in
      # public/, shipped and pointed at a sitemap.xml that CI never wrote. 13 Oct 2026.
      # Built from the rendered HTML, so it withholds noindex pages and redirect stubs.
      - name: Write the sitemap
        run: python3 node_modules/@daviddef/archive-kit/kit/tools/sitemap.py
        working-directory: site
      # The archive's standard for living people (version 2, 16 October 2026): a living person
      # (80 or younger, with no death recorded) is named with their relationships and their town
      # and country, and nothing more, on a page that is noindex; a possible minor is published
      # nowhere; every person the archive names has a page of their own. This checks the RENDERED
      # pages, the served JSON, the sitemap, the search index and the generated register rather
      # than trusting the generator, and the deploy is gated on it. It refuses to pass if it can
      # recognise no living person or finds no person page.
      # Runs in --hashes mode here: the names cannot be recognised from the harvest, which this
      # repository does not hold, so CI recognises them by salted digest, finds the living and the
      # held out by the ids in data/guarded-hashes.json, and re-applies the kit's living_rule to the
      # register's own fields. The exact --harvest check, and the exact leak scan for the harvest's
      # dates, run locally, where the private source is.
      - name: Check that every living person is shown as a name, a relationship and a place only
        run: python3 tools/check-living.py --dist site/dist --mode hashes
      # The gate is tested the way it is meant to be trusted: a fault is planted for every rule in
      # a copy of the build, and the step fails unless each one is caught and each control passes.
      - name: Check that the living-people gate still catches what it should
        run: python3 tools/selftest-living.py --dist site/dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
